<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Syllabus</title>
<meta name="description" content="A study planner for university: courses, deadlines, exam countdowns and a focus timer.">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1219" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Syllabus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Lists and courses">
    <div class="brand"><span class="mark" id="brandMark"></span>Syllabus</div>
    <nav id="smartNav"></nav>
    <div class="side-h"><span>Courses</span><button class="icon-btn sm" data-act="newCourse" aria-label="Add course" id="addCourseBtn"></button></div>
    <nav id="courseNav"></nav>
    <div class="side-h"><span>Tools</span></div>
    <nav id="toolNav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main class="main">
    <header class="main-h">
      <button class="icon-btn only-mobile" data-act="drawer" aria-label="Open menu" id="menuBtn"></button>
      <div class="ttl"><div class="eyebrow" id="viewEyebrow"></div><h1 id="viewTitle">Today</h1></div>
      <div class="h-actions" id="viewActions"></div>
    </header>
    <form class="qa" id="quickAdd" autocomplete="off">
      <div class="qa-box"><span id="qaIcon"></span><input id="qaInput" aria-label="Add a task" placeholder="Add a task, e.g. Problem set 5 #MATH201 fri 23:59 !high"></div>
      <div class="qa-chips" id="qaChips"></div>
    </form>
    <div class="view-body" id="viewBody"><p class="loading">Opening your planner…</p></div>
  </main>

  <aside class="rail" id="rail" aria-label="Details"></aside>
</div>
<div class="scrim" id="scrim" hidden data-act="scrim"></div>

<div class="dlg-wrap" id="dlg" hidden>
  <form class="dlg" id="courseForm" autocomplete="off">
    <h2 id="dlgTitle">New course</h2>
    <label class="fld"><span>Course name</span><input id="cName" required maxlength="60" placeholder="Linear Algebra"></label>
    <label class="fld"><span>Course code</span><input id="cCode" maxlength="14" placeholder="MATH201"></label>
    <div class="fld"><span>Colour</span><div class="swatches" id="cSw"></div></div>
    <div class="dlg-act"><button type="button" class="btn ghost" data-act="dlgClose">Cancel</button><button class="btn primary" type="submit" id="cSave">Save course</button></div>
  </form>
</div>
<div class="toast" id="toast" hidden role="status"></div>


<div class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="brand"><span class="mark" id="authMark"></span>Syllabus</div>
    <h1>Your semester on every device</h1>
    <p class="muted">Sign in to sync courses, deadlines and focus time between your phone and computer.</p>
    <button type="button" class="btn auth-google" data-auth="google">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.8 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.3V7.1H2.1a11 11 0 0 0 0 9.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>
      Continue with Google</button>
    <div class="or"><span>or use email</span></div>
    <form id="authForm" class="auth-form">
      <label class="fld"><span>Email</span><input id="aEmail" type="email" autocomplete="email" required></label>
      <label class="fld"><span>Password</span><input id="aPass" type="password" autocomplete="current-password" minlength="6" required></label>
      <button class="btn primary" type="submit" id="authSubmit">Sign in</button>
    </form>
    <p class="auth-msg" id="authMsg" role="status"></p>
    <div class="auth-foot"><span id="authSwitch"></span><button type="button" class="link-btn" data-auth="reset">Forgot password?</button></div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
