# Builds the Mac and Windows apps on GitHub's computers, for free.
# On GitHub: Actions tab -> "Build desktop apps" -> Run workflow.
# When it finishes, download Syllabus-mac and Syllabus-windows from the run's "Artifacts" section.
name: Build desktop apps

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash desktop/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Syllabus-mac
          path: dist-mac/Syllabus-mac.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: desktop\build.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Syllabus-windows
          path: dist/Syllabus.exe
